<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wize Restaurant RMS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>

<!-- ===========================================================================
     Application shell. Nothing module-specific lives here: every page mounts
     its own markup into <main class="content"> and its own dialogs onto <body>.
     =========================================================================== -->
<div class="layout">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 60 30" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 4 L13 26 L23 4" /><path d="M29 26 V4 H40 a7 7 0 0 1 0 14 H33 L44 26" /><path d="M46 4 L51 26 L58 4" />
        </svg>
        <span>WIZE RESTAURANT</span>
      </div>
      <button class="collapse-btn" id="collapseBtn" title="Toggle sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>
    <div class="role">ADMIN</div>
    <nav class="nav"></nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="breadcrumb">
        <button class="mob-menu-btn" id="mobMenuBtn" title="Open menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <span id="crumbGroup"></span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        <b id="crumbPage"></b>
      </div>
      <div class="top-right">
        <span class="bell"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg></span>
        <div class="avatar">
          <svg width="34" height="34" viewBox="0 0 40 40"><circle cx="20" cy="15" r="7" fill="#f5c9a5"/><path d="M13 13c0-5 3-8 7-8s7 3 7 8c-2-2-4-3-7-3s-5 1-7 3z" fill="#2d2d2d"/><path d="M7 38c1-8 6-12 13-12s12 4 13 12z" fill="#9ccc3c"/></svg>
        </div>
      </div>
    </header>

    <!-- every module's view is appended here -->
    <main class="content"></main>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<!-- ===========================================================================
     Load order matters: chrome and engine, then shared data, then the modules
     that register themselves, and finally the shell that builds the nav and
     routes to whatever registered. Plain <script> tags on purpose — ES modules
     are blocked by CORS on file://, and this prototype must open by double-click.
     =========================================================================== -->
<script src="assets/js/ui.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/data.js"></script>

<!-- Inventory -->
<script src="assets/js/modules/category-master.js"></script>
<script src="assets/js/modules/menu-section.js"></script>
<script src="assets/js/modules/recipe.js"></script>
<script src="assets/js/modules/inventory.js"></script>

<!-- Organisation & people -->
<script src="assets/js/modules/setting.js"></script>
<script src="assets/js/modules/user-management.js"></script>

<!-- Suppliers & billing -->
<script src="assets/js/modules/vendor.js"></script>
<script src="assets/js/modules/pos-tax.js"></script>
<script src="assets/js/modules/pos-table-config.js"></script>

<!-- Operations (staff must load before housekeeping and dashboard) -->
<script src="assets/js/modules/staff.js"></script>
<script src="assets/js/modules/housekeeping.js"></script>
<script src="assets/js/modules/dashboard.js"></script>

<!-- Sidebar + router, last: it renders whatever the modules registered -->
<script src="assets/js/shell.js"></script>

</body>
</html>
